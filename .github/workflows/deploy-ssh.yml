name: Continuous Deployment (SSH Release Only)

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to Production Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Remote Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Source Code to Server via rsync
        run: |
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.cache' \
            --exclude='node_modules' \
            --exclude='apps/frontend/.next' \
            --exclude='infra/data' \
            --exclude='results' \
            --exclude='experiments' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR || '/opt/legal-graphrag' }}/

      - name: Build & Restart Docker Services on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.REMOTE_DIR || '/opt/legal-graphrag' }}
            if docker compose version >/dev/null 2>&1; then
              docker compose -f infra/docker-compose.yml up -d --build
            else
              docker-compose -f infra/docker-compose.yml up -d --build
            fi
            echo "Deployment completed for release tag: ${{ github.event.release.tag_name }}"
