services:
  neo4j:
    image: neo4j:5.26.28-community
    container_name: graphrag-neo4j-prod
    restart: unless-stopped
    env_file:
      - env/.env.compose
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"
    volumes:
      - ../data/neo4j/data:/data
      - ../data/neo4j/logs:/logs
      - ../data/neo4j/import:/var/lib/neo4j/import
      - ../data/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: graphrag-postgres-prod
    restart: unless-stopped
    env_file:
      - env/.env.compose
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag -d graphrag_conversations"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/${REPOSITORY_OWNER:-legal-graphrag-platform-vn}/legal-graphrag-platform-vn-backend:${TAG:-latest}
    container_name: graphrag-backend-prod
    restart: unless-stopped
    env_file:
      - env/.env.backend
    ports:
      - "8000:8000"
    volumes:
      - ../data/logs:/var/log/chat
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/${REPOSITORY_OWNER:-legal-graphrag-platform-vn}/legal-graphrag-platform-vn-frontend:${TAG:-latest}
    container_name: graphrag-frontend-prod
    restart: unless-stopped
    env_file:
      - env/.env.frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend

  # ============================================================================
  # Observability Stack (Loki + Promtail + Grafana)
  # ============================================================================
  loki:
    image: grafana/loki:3.2.1
    container_name: graphrag-loki-prod
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../observability/loki-config.yml:/etc/loki/config.yml:ro
      - ../data/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  promtail:
    image: grafana/promtail:3.2.1
    container_name: graphrag-promtail-prod
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../data/logs:/var/log/chat:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    container_name: graphrag-grafana-prod
    restart: unless-stopped
    env_file:
      - env/.env.compose
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: "light"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ../data/grafana:/var/lib/grafana
    depends_on:
      - loki

  # ============================================================================
  # Container Management Web UI (Portainer)
  # ============================================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: graphrag-portainer-prod
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/portainer:/data

networks:
  default:
    name: graphrag-network-prod
