services:
  neo4j:
    image: neo4j:5.26.28-community
    container_name: graphrag-neo4j-prod
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: graphrag-postgres-prod
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-graphrag_conversations}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphrag} -d ${POSTGRES_DB:-graphrag_conversations}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/${REPOSITORY_OWNER:-legal-graphrag-platform-vn}/legal-graphrag-platform-vn-backend:${TAG:-latest}
    container_name: graphrag-backend-prod
    restart: unless-stopped
    env_file:
      - env.prod/.env.compose
      - env.prod/.env.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_MODE: ${APP_MODE:-mock}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/${REPOSITORY_OWNER:-legal-graphrag-platform-vn}/legal-graphrag-platform-vn-frontend:${TAG:-latest}
    container_name: graphrag-frontend-prod
    restart: unless-stopped
    env_file:
      - env.prod/.env.frontend
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: ${PORT:-3000}
    depends_on:
      - backend

networks:
  default:
    name: graphrag-network-prod
